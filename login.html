<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexaTP | Internal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #ffffff;
            --bg-subtle: #f9fafb;
            --accent: #f5c400;
            --text-main: #0f172a;
        }
        body {
            background-color: var(--bg-subtle);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at top center, #fff9e6 0%, var(--bg-subtle) 70%);
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .login-card h2 {
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .btn-main {
            background: var(--accent);
            color: #000;
            padding: 12px 35px;
            border-radius: 100px;
            font-weight: 600;
            text-decoration: none;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 196, 0, 0.3);
        }
        .error-msg {
            color: #dc3545;
            font-size: 14px;
            display: none;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .dashboard {
            display: none;
        }
        .dashboard-link {
            display: block;
            margin: 15px 0;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: 0.2s;
            background: #fff;
        }
        .dashboard-link:hover {
            background: rgba(245, 196, 0, 0.1);
            border-color: var(--accent);
        }
        .logo-img {
            height: 45px;
            margin-bottom: 30px;
        }
    </style>

<style>
.mobile-submenu { padding-left: 20px; margin-top: 10px; display: none; border-left: 2px solid rgba(245,196,0,0.3); max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.mobile-submenu.active { display: block; max-height: 2000px; animation: slideDown 0.3s ease; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.mobile-submenu li a { font-size: 16px; padding: 10px 15px; }
.mobile-dropdown-toggle { color: var(--text-main); font-size: 18px; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; transition: all 0.3s ease; user-select: none; }
.mobile-dropdown-toggle:hover { background: rgba(245,196,0,0.1); color: #f5c400; }
.mobile-dropdown-toggle::after { content: '\25BC'; font-size: 12px; transition: transform 0.3s ease; }
.mobile-dropdown-toggle.active { color: #f5c400; }
.mobile-dropdown-toggle.active::after { transform: rotate(180deg); }
</style>

</head>
<body>
    <div class="login-card" id="loginForm">
        <img src="final-header-logo1.jpeg" alt="HexaTP" class="logo-img" />
        <h2>Internal Portal</h2>
        <div class="error-msg" id="errorMsg">Unauthorized email address.</div>
        <form onsubmit="handleLogin(event)">
            <input type="email" id="emailInput" class="form-control" placeholder="Enter your email address" required>
            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
            <button type="submit" class="btn-main">Login</button>
        </form>
        <a href="index.html" style="display: block; margin-top: 20px; color: #64748b; font-size: 14px; text-decoration: none;">&larr; Back to Home</a>
    </div>

    <div class="login-card dashboard" id="dashboard">
        <img src="final-header-logo1.jpeg" alt="HexaTP" class="logo-img" />
        <h2>Welcome</h2>
        <p style="color: #64748b; margin-bottom: 25px;">Select a portal to continue:</p>
        <a href="https://www.hexake.com/login" class="dashboard-link" target="_blank">HexaKE Platform</a>
        <a href="calendar.html" class="dashboard-link">Compliance & Calendar Desk</a>
    </div>

    <script>
        const userCredentials = {
            "md@hexatp.com": "Md@123",
            "gp@hexatp.com": "Gp@234",
            "ps@hexatp.com": "Ps@345",
            "saniya@hexatp.com": "Saniya@456",
            "himanshu@hexatp.com": "Himanshu@567",
            "yishu@hexatp.com": "Yishu@678",
            "nk@hexatp.com": "Nk@789",
            "astha@hexatp.com": "Astha@890"
        };

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("emailInput").value.toLowerCase().trim();
            const password = document.getElementById("passwordInput").value;

            if (userCredentials[email] && userCredentials[email] === password) {
                document.getElementById("loginForm").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                document.getElementById("errorMsg").style.display = "none";
            } else {
                document.getElementById("errorMsg").innerText = "Invalid email or password.";
                document.getElementById("errorMsg").style.display = "block";
            }
        }
    </script>

<script>
function toggleSubmenu(submenuId, toggleElement) {
    const submenu = document.getElementById(submenuId);
    if (submenu) {
        submenu.classList.toggle('active');
        toggleElement.classList.toggle('active');
    }
}
</script>

    <script src="scripts/hexagon-bg.js"></script>
</body>
</html>
